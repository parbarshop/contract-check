name: contract-check

on:
  schedule:
    # 03:17 UTC daily — off the hour to avoid the stampede of cron jobs at :00
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run contract check
        id: check
        run: python scripts/contract_check.py

      - name: Commit snapshot if it changed
        run: |
          git config user.name  "contract-check"
          git config user.email "contract-check@users.noreply.github.com"
          git add snapshots/
          if git diff --staged --quiet; then
            echo "no snapshot change"
          else
            git commit -m "snapshot $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push
          fi

      - name: Fail the run when a contract is broken
        if: steps.check.outcome == 'failure'
        run: exit 1
